plugins { id 'com.android.application' }
android {
    namespace 'tw.boox.voicepage'
    compileSdk 35
    defaultConfig {
        applicationId 'tw.boox.voicepage'
        minSdk 28
        targetSdk 33
        versionCode 9
        versionName '0.5.3'
    }
    // One APK per ABI: arm64-v8a is published for BOOX Go 7 (Snapdragon 690); x86_64 exists only
    // so the CI emulator can run the same build when it cannot translate ARM code.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    // Fixed debug key for local debug builds. Published APKs are release builds signed in CI by
    // scripts/sign_apk.sh, which rotates from this public key to the private release key.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        // Unsigned here; CI signs it (see scripts/sign_apk.sh).
        release { minifyEnabled false }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
tasks.register('verifyChineseModel') {
    doLast {
        if (!file('src/main/assets/model-cn/am/final.mdl').isFile() ||
            !file('src/main/assets/model-cn/conf/model.conf').isFile())
            throw new GradleException('請先執行 python3 scripts/prepare_model.py')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyChineseModel' }
