plugins { id 'com.android.application' }
android {
    namespace 'tw.boox.voicepage'
    compileSdk 35
    defaultConfig {
        applicationId 'tw.boox.voicepage'
        minSdk 28
        targetSdk 33
        versionCode 5
        versionName '0.4.0'
        // BOOX Go 7 (Snapdragon 690) is arm64; x86_64 is kept only for the CI emulator test.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    // Fixed debug key: CI runners otherwise generate a new key per run, and Android refuses to
    // update an installed APK signed with a different key. Personal sideload use only.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
tasks.register('verifyChineseModel') {
    doLast {
        if (!file('src/main/assets/model-cn/am/final.mdl').isFile() ||
            !file('src/main/assets/model-cn/conf/model.conf').isFile())
            throw new GradleException('請先執行 python3 scripts/prepare_model.py')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyChineseModel' }
