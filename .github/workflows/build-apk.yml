name: BOOX Android APK build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test command recognition logic
        run: bash tests/run_tests.sh
      - name: Download official Chinese voice model
        run: python3 scripts/prepare_model.py
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and model provenance
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          cat model-source.json
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/model-cn/am/final.mdl'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            model-source.json
