name: BOOX Android APK build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides the Android SDK; avoid obsolete 'sdkmanager tools'.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0' || test ${PIPESTATUS[1]} -eq 0
      - name: Test command recognition logic
        run: bash tests/run_tests.sh
      # The official model ZIP never changes for a given name; cache it instead of re-downloading.
      - name: Cache Chinese voice model
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/assets/model-cn
            model-source.json
          key: vosk-model-small-cn-0.22-v1
      - name: Download official Chinese voice model
        run: python3 scripts/prepare_model.py
      - name: Check grammar words exist in model vocabulary
        run: bash tests/run_tests.sh app/src/main/assets/model-cn
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and model provenance
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          cat model-source.json
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/model-cn/am/final.mdl'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libvosk.so'
      - name: Verify APK permissions (no network access)
        run: |
          AAPT2="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -F "android.permission.INTERNET" permissions.txt; then
            echo "::error::APK must not request INTERNET permission"; exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            model-source.json

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          path: downloaded-apk
      # Hardware acceleration cuts emulator boot from ~11 minutes to about 1-2 minutes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 emulator installation and activity launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/emulator_smoke.sh
