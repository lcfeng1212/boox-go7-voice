name: BOOX Android APK build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      official: ${{ steps.sign.outputs.official }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides the Android SDK; avoid obsolete 'sdkmanager tools'.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0' || test ${PIPESTATUS[1]} -eq 0
      - name: Test command recognition logic
        run: bash tests/run_tests.sh
      # The official model ZIP never changes for a given name; cache it instead of re-downloading.
      - name: Cache Chinese voice model
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/assets/model-cn
            model-source.json
          key: vosk-model-small-cn-0.22-v1
      - name: Download official Chinese voice model
        run: python3 scripts/prepare_model.py
      - name: Check grammar words exist in model vocabulary
        run: bash tests/run_tests.sh app/src/main/assets/model-cn
        env:
          PROBE_WORDS: 左滑 右滑 左 右 滑 回到首页 回到 首页 回 到 关闭 关 闭 下 上
      - name: Build release APK (unsigned)
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Sign APK (key rotation to private release key)
        id: sign
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: bash scripts/sign_apk.sh app/build/outputs/apk/release/app-release-unsigned.apk BOOX-Go7-VoicePage.apk
      - name: Verify APK and model provenance
        run: |
          ls -lh BOOX-Go7-VoicePage.apk
          sha256sum BOOX-Go7-VoicePage.apk
          cat model-source.json
          unzip -l BOOX-Go7-VoicePage.apk | grep 'assets/model-cn/am/final.mdl'
          unzip -l BOOX-Go7-VoicePage.apk | grep 'lib/arm64-v8a/libvosk.so'
      - name: Verify APK permissions (no network access)
        run: |
          AAPT2="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump permissions BOOX-Go7-VoicePage.apk | tee permissions.txt
          if grep -F "android.permission.INTERNET" permissions.txt; then
            echo "::error::APK must not request INTERNET permission"; exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          if-no-files-found: error
          path: |
            BOOX-Go7-VoicePage.apk
            model-source.json

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          path: downloaded-apk
      # Hardware acceleration cuts emulator boot from ~11 minutes to about 1-2 minutes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 emulator installation and activity launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/emulator_smoke.sh

  # Publish the tested APK as a fixed-URL download (no GitHub login, no ZIP) for the e-reader.
  release:
    needs: [build, emulator-smoke]
    # Only officially signed builds are published (needs the RELEASE_KEYSTORE_* secrets).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.official == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          path: downloaded-apk
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)"
          cp "$(find downloaded-apk -name BOOX-Go7-VoicePage.apk -print -quit)" BOOX-Go7-VoicePage.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BOOX-Go7-VoicePage.apk --target "$GITHUB_SHA" --latest \
            --title "BOOX Go 7 中文語音翻頁 v$VERSION" \
            --notes "版本 v$VERSION（commit ${GITHUB_SHA::7}）。已通過單元測試與 Android 13 模擬器安裝測試。下載 BOOX-Go7-VoicePage.apk 直接安裝，安裝與使用說明見 README。"
