name: BOOX Android APK build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides the Android SDK; avoid obsolete 'sdkmanager tools'.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0' || test ${PIPESTATUS[1]} -eq 0
      - name: Test command recognition logic
        run: bash tests/run_tests.sh
      - name: Download official Chinese voice model
        run: python3 scripts/prepare_model.py
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and model provenance
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          cat model-source.json
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/model-cn/am/final.mdl'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            model-source.json

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: BOOX-Go7-Chinese-VoicePage-APK
          path: downloaded-apk
      - name: Android 13 emulator installation and activity launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            APK="$(find downloaded-apk -name app-debug.apk -print -quit)"
            test -n "$APK"
            adb install "$APK"
            adb shell am start -W -n tw.boox.voicepage/.MainActivity
            sleep 4
            adb shell pidof tw.boox.voicepage
            adb shell dumpsys package tw.boox.voicepage | grep -F "OfflineListeningService"
            adb shell dumpsys package tw.boox.voicepage | grep -F "SwipeAccessibilityService"
            echo "Android 13 smoke test PASS: APK installed, activity running, services registered"
